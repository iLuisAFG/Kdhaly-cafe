<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130" fill="none">
  <defs>
    <radialGradient id="beanShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7B4C28"/>
      <stop offset="45%" stop-color="#462512"/>
      <stop offset="85%" stop-color="#281409"/>
      <stop offset="100%" stop-color="#190B04"/>
    </radialGradient>
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140702"/>
      <stop offset="50%" stop-color="#0E0502"/>
      <stop offset="100%" stop-color="#241107"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#1A0D07" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Bean Body -->
  <path d="M 50 8 C 76 8, 92 34, 92 68 C 92 102, 74 122, 50 122 C 26 122, 8 102, 8 68 C 8 34, 24 8, 50 8 Z" 
        fill="url(#beanShine)" filter="url(#softShadow)"/>
  <!-- Highlight reflection -->
  <path d="M 32 20 C 44 14, 60 14, 68 22 C 72 26, 70 32, 64 30 C 52 25, 38 28, 30 34 C 26 36, 24 28, 32 20 Z" 
        fill="#9C6436" opacity="0.45"/>
  <!-- Center Crease S-Curve -->
  <path d="M 50 12 C 48 30, 41 46, 52 64 C 62 80, 56 100, 50 118" 
        stroke="url(#creaseGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 51 16 C 49 32, 43 48, 53 64 C 63 80, 57 98, 51 114" 
        stroke="#120501" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crease light edge -->
  <path d="M 54 22 C 52 36, 47 48, 56 64 C 64 78, 60 92, 54 108" 
        stroke="#683D1D" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
